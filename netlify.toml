# Netlify hosts the whole store: the React storefront (static, on the CDN) and the Express API
# (a Netlify Function in client/netlify/functions/api.mjs → server/src/netlify.js).
# Publish with `npm run deploy:web` from the repo root.

[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Product photos go through Netlify's image CDN (resized, WebP/AVIF) — see client/src/lib/format.js.
  VITE_IMAGE_CDN = "netlify"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # sharp is a native module only used for local image resizing; the image CDN does that here.
  ignored_node_modules = ["sharp"]

# The API, sitemap and robots.txt are served by the function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

# Photos uploaded on the live site are kept in Netlify Blobs and served by the function.
[[redirects]]
  from = "/uploads/blob/*"
  to = "/.netlify/functions/api/uploads/blob/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/api/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "/.netlify/functions/api/robots.txt"
  status = 200
  force = true

# Built JS/CSS files have a content hash in their name, so browsers can keep them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Product photos (copied into the site at deploy time) — cache for a week.
[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Every other path (/admin, /admin/login, /product/..., /account) is a page of the React app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
